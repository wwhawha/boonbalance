const app=document.querySelector('#app');let favorites=read('bb-favorites',[]),checks=read('bb-checks',{}),profile=read('bb-profile',null);function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('อุปกรณ์นี้ไม่อนุญาตให้บันทึกข้อมูล')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(path){location.hash=path}function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2200)}

function card(p){const cat=cats.find(c=>c.id===p.cat);return `<article class="card"><button class="favorite" data-fav="${p.id}" aria-label="${favorites.includes(p.id)?'ยกเลิกบันทึก':'บันทึก'} ${p.name}" aria-pressed="${favorites.includes(p.id)}">${favorites.includes(p.id)?'♥':'♡'}</button><img src="${picture(p.img)}" alt="ภาพประกอบหมวด${cat.name}จากวิดีโอต้นแบบ" loading="lazy"><div class="cardbody"><span class="pill">${cat.name}</span><h3>${p.name}</h3><p>${p.area}</p><p>${p.desc}</p><button class="primary" data-go="place/${p.id}">ดูรายละเอียด ↗</button></div></article>`}
function home(){shell(`<section class="hero"><img class="lotus" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTEwIiBmaWxsPSJub25lIiBzdHJva2U9IiM4MDUyOWIiIHN0cm9rZS13aWR0aD0iNSI+PHBhdGggZD0iTTUwIDEwMkMzNyA4OSAxMiA2NCAxMiA0MmEzOCAzOCAwIDAxNzYgMGMwIDIyLTI1IDQ3LTM4IDYwWiIvPjxwYXRoIGQ9Ik01MCA2N0MzMCA2NyAyMyA1MiAyNSAzOWMxNy0xIDI1IDEzIDI1IDI4Wm0wIDBjMjAgMCAyNy0xNSAyNS0yOC0xNy0xLTI1IDEzLTI1IDI4WiIvPjxwYXRoIGQ9Ik0zOSA0NGMtMS0xMiA1LTIxIDExLTI3IDcgNyAxMyAxNiAxMSAyNyIvPjwvc3ZnPgo=" alt=""><span class="eyebrow">พื้นที่เล็ก ๆ สำหรับเติมพลังใจ</span><h1>วันนี้ อยากเติมพลังใจ<br>เรื่องไหนดี?</h1><p>ค้นหาสถานที่ที่ตรงกับความสนใจ<br>เตรียมตัวให้พร้อม แล้วออกเดินทางอย่างสบายใจ</p></section><input class="search" id="search" type="search" aria-label="ค้นหาสถานที่" placeholder="⌕  ค้นหาชื่อสถานที่ หรือย่านที่อยากไป"><div class="categories">${cats.map(c=>`<button class="category ${c.id}" data-go="category/${c.id}"><span class="symbol">${c.icon}</span><strong>${c.name} ↗</strong><small>${c.desc}</small></button>`).join('')}</div><div class="sectionhead"><h2 id="result-title">สถานที่สำหรับเริ่มต้น</h2><span class="muted" id="count">${places.length} สถานที่</span></div><div id="results" class="grid">${places.map(card).join('')}</div>`);document.querySelector('#search').addEventListener('input',e=>filter(e.target.value,places))}
function filter(q,list){const result=list.filter(p=>(p.name+p.area+p.desc).toLowerCase().includes(q.trim().toLowerCase()));document.querySelector('#results').innerHTML=result.length?result.map(card).join(''):'<div class="empty">ไม่พบสถานที่ที่ค้นหา<br><span class="muted">ลองใช้ชื่อสถานที่หรือย่านอื่นอีกครั้ง</span></div>';document.querySelector('#count').textContent=`${result.length} สถานที่`;}
function category(id){const c=cats.find(c=>c.id===id);if(!c)return go('home');const list=places.filter(p=>p.cat===id);shell(`<button class="back" data-go="home">← กลับหน้าสำรวจ</button><section class="hero ${c.id}"><span class="eyebrow">${c.en.toUpperCase()}</span><h1>${c.icon} ${c.name}</h1><p>${c.desc} ผ่านการเดินทางและความเชื่อในแบบของคุณ</p></section><input id="search" class="search" type="search" aria-label="ค้นหาในหมวด${c.name}" placeholder="ค้นหาสถานที่ในหมวดนี้"><div class="sectionhead"><h2>สถานที่แนะนำ</h2><span id="count" class="muted">${list.length} สถานที่</span></div><div class="grid" id="results">${list.map(card).join('')}</div>`);document.querySelector('#search').oninput=e=>filter(e.target.value,list)}
function detail(id){const p=places.find(p=>p.id===id);if(!p)return go('home');const cat=cats.find(c=>c.id===p.cat);shell(`<button class="back" data-go="category/${p.cat}">← กลับหมวด${cat.name}</button><img class="detailhero" src="${picture(p.img)}" alt="ภาพประกอบหมวด${cat.name}จากวิดีโอต้นแบบ"><p class="muted">รูปจากวิดีโอต้นแบบ บางรายการใช้ภาพแทนชั่วคราว</p><span class="pill">${cat.name}</span><h1>${p.name}</h1><p>${p.area}</p><div class="actions"><a class="primary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.query)}" target="_blank" rel="noopener noreferrer">เปิดแผนที่ ↗</a><button class="secondary" data-fav="${p.id}">${favorites.includes(id)?'♥ บันทึกแล้ว':'♡ บันทึกสถานที่'}</button><button class="secondary" data-share="${p.id}">แชร์สถานที่</button></div><div class="detailgrid"><div><section class="box"><h3>รู้จักสถานที่</h3><p>${p.desc}</p><p class="notice">ข้อมูลด้านการขอพรเป็นความเชื่อส่วนบุคคล ไม่รับรองผลลัพธ์${p.cat==='health'?' และไม่ใช้แทนการรักษาพยาบาล':''}</p></section><section class="box"><h3>วิธีสักการะและข้อปฏิบัติ</h3><ol><li>ตรวจสอบกฎและคำแนะนำของสถานที่ก่อนเข้าสักการะ</li><li>แต่งกายสุภาพ และปฏิบัติตามป้ายหรือคำแนะนำของเจ้าหน้าที่</li><li>ใช้ธูป เทียน หรือเครื่องสักการะเฉพาะในบริเวณที่อนุญาต</li><li>เคารพผู้ร่วมใช้สถานที่ และรักษาความสะอาด</li></ol><p class="muted">แนวทางทั่วไป ไม่ใช่ขั้นตอนเฉพาะของแต่ละสถานที่</p></section></div><aside><section class="box"><h3>ข้อมูลก่อนเดินทาง</h3><p>◷ เวลาเปิด–ปิด<br><strong>โปรดตรวจสอบกับสถานที่</strong></p><p>✧ สีมงคลตามต้นแบบ<br><strong>${p.color}</strong></p><p>ค่าใช้จ่ายและสิ่งที่ต้องเตรียม<br><strong>ตรวจสอบประกาศของสถานที่ก่อนเดินทาง</strong></p></section><section class="box checks"><h3>รายการเตรียมตัว</h3><p class="muted">รายการส่วนตัว บันทึกในอุปกรณ์นี้</p>${['ตรวจสอบเวลาเปิด–ปิด','วางแผนเส้นทางเดินทาง','เตรียมเครื่องแต่งกายสุภาพ','ตรวจสอบสิ่งที่สถานที่อนุญาต'].map((t,i)=>`<label><input type="checkbox" data-check="${id}-${i}" ${checks[id+'-'+i]?'checked':''}>${t}</label>`).join('')}</section></aside></div>`)}
function saved(){shell(`<span class="eyebrow">YOUR LITTLE JOURNEY</span><h1>สถานที่ที่บันทึกไว้</h1><p>เก็บไว้เป็นไอเดียสำหรับการเดินทางครั้งต่อไป</p><div class="grid">${favorites.length?places.filter(p=>favorites.includes(p.id)).map(card).join(''):'<div class="empty">ยังไม่มีสถานที่ที่บันทึกไว้<p>กด ♡ ที่สถานที่ที่สนใจ เพื่อกลับมาดูภายหลัง</p><button class="primary" data-go="home">เริ่มสำรวจ</button></div>'}</div>`,'saved')}

document.querySelector('#switch-auth').onclick=()=>{authMode=authMode==='login'?'signup':'login';user()};document.querySelector('#auth-form').onsubmit=e=>{e.preventDefault();const name=authMode==='signup'?document.querySelector('#auth-name').value.trim():'ผู้เยี่ยมชม';if(!name)return;profile={name};save('bb-profile',profile);go('home')};
document.querySelectorAll('[data-social]').forEach(btn=>btn.onclick=()=>{document.querySelector('#auth-message').textContent=btn.dataset.social+' ยังไม่ได้เชื่อมระบบบัญชีจริง กรุณาใช้ปุ่ม '+(authMode==='login'?'Log In':'Sign Up')+' เพื่อทดลองแอป';});}
function render(){const [route,id]=(location.hash.slice(1)||'welcome').split('/');({welcome,home,install,category:()=>category(id),place:()=>detail(id),saved,profile:user}[route]||home)();window.scrollTo(0,0)}
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-go],[data-fav],[data-share]');if(!btn)return;if(btn.dataset.go)return go(btn.dataset.go);if(btn.dataset.fav){const id=btn.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save('bb-favorites',favorites);const y=scrollY;render();scrollTo(0,y);return}if(btn.dataset.share){try{const url=location.href;if(navigator.share)await navigator.share({title:'BoonBalance',url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('คัดลอกลิงก์แล้ว')}else toast('คัดลอกลิงก์จากแถบที่อยู่เพื่อแชร์ได้เลย')}catch(err){if(err.name!=='AbortError')toast('คัดลอกลิงก์จากแถบที่อยู่เพื่อแชร์ได้เลย')}}});document.addEventListener('change',e=>{if(e.target.dataset.check){checks[e.target.dataset.check]=e.target.checked;save('bb-checks',checks)}});window.addEventListener('hashchange',render);

function install(){shell(`<button class="back" data-go="home">← กลับหน้าสำรวจ</button><div class="welcome"><div class="logo-halo"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTEwIiBmaWxsPSJub25lIiBzdHJva2U9IiM4MDUyOWIiIHN0cm9rZS13aWR0aD0iNSI+PHBhdGggZD0iTTUwIDEwMkMzNyA4OSAxMiA2NCAxMiA0MmEzOCAzOCAwIDAxNzYgMGMwIDIyLTI1IDQ3LTM4IDYwWiIvPjxwYXRoIGQ9Ik01MCA2N0MzMCA2NyAyMyA1MiAyNSAzOWMxNy0xIDI1IDEzIDI1IDI4Wm0wIDBjMjAgMCAyNy0xNSAyNS0yOC0xNy0xLTI1IDEzLTI1IDI4WiIvPjxwYXRoIGQ9Ik0zOSA0NGMtMS0xMiA1LTIxIDExLTI3IDcgNyAxMyAxNiAxMSAyNyIvPjwvc3ZnPgo=" alt=""></div><h1>BoonBalance<br>ใกล้ใจขึ้นอีกนิด</h1><p>เพิ่มลงหน้าจอหลัก แล้วเปิดใช้งานแบบแอป</p><div class="box"><h3>iPhone / iPad</h3><p>เปิดลิงก์ผ่าน Safari แล้วกดปุ่มแชร์ → เพิ่มไปยังหน้าจอโฮม → เปิดเป็นเว็บแอป (ถ้ามี) → เพิ่ม</p><h3>Android / Chrome</h3><p>กดเมนู ⋮ → ติดตั้งแอป หรือ เพิ่มลงในหน้าจอหลัก ชื่อเมนูอาจต่างกันตามรุ่น</p><button id="native-install" class="primary">${installPrompt?'ติดตั้ง BoonBalance':'ดูวิธีติดตั้งด้านบน'}</button><p class="muted">ต้องเปิดผ่านลิงก์ HTTPS เช่น GitHub Pages หรือ localhost ระหว่างพัฒนา</p></div><p class="muted">ข้อมูลที่เคยเปิดจะใช้งานออฟไลน์ได้หลังโหลดครั้งแรก แผนที่ต้องเชื่อมต่ออินเทอร์เน็ต</p></div>`,'profile');document.querySelector('#native-install').onclick=async()=>{if(!installPrompt)return toast('ใช้เมนูของเบราว์เซอร์ตามคำแนะนำด้านบน');const prompt=installPrompt;await prompt.prompt();await prompt.userChoice;installPrompt=null;install()};}
